spring.application.name=veloxplay
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL is required at runtime. H2 is available only to tests.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/veloxplay}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Expand the old USER/ADMIN check before Hibernate and the account bootstrap run.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
spring.sql.init.separator=@@
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

server.port=${SERVER_PORT:8080}

# Required private signing key (at least 32 bytes).
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.issuer=veloxplay

app.site.url=${SITE_URL:http://localhost:4200}
app.cors.origins=${CORS_ORIGINS:${app.site.url},http://localhost:4200,http://127.0.0.1:4200}
server.forward-headers-strategy=none
app.security.trusted-proxies=${TRUSTED_PROXY_CIDRS:}
app.security.rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.login=${AUTH_LOGIN_LIMIT:20}
app.security.rate-limit.register=${AUTH_REGISTER_LIMIT:5}
app.security.rate-limit.refresh=${AUTH_REFRESH_LIMIT:60}
app.security.rate-limit.max-entries=${AUTH_RATE_LIMIT_MAX_ENTRIES:10000}
app.seed.enabled=${APP_SEED_ENABLED:true}

# Public demo accounts; never grant them ADMIN.
app.seed.moderator-email=${SEED_MODERATOR_EMAIL:moderador@veloxplay.com}
app.seed.moderator-password=${SEED_MODERATOR_PASSWORD:Moderador@123}
app.seed.demo-email=${SEED_DEMO_EMAIL:demo@veloxplay.com}
app.seed.demo-password=${SEED_DEMO_PASSWORD:Demo@123}

# Optional private administrator bootstrap: no public/default credentials.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.demo.ttl-minutes=${DEMO_TTL_MINUTES:60}
app.demo.cleanup-enabled=${DEMO_CLEANUP_ENABLED:true}
app.demo.cleanup-delay-ms=${DEMO_CLEANUP_DELAY_MS:600000}
