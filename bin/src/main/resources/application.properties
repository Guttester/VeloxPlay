spring.application.name=veloxplay

# Datasource — override with SPRING_DATASOURCE_* in production (PostgreSQL).
# Default is file-based H2 so the app boots without Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/veloxplay;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

server.port=${SERVER_PORT:8080}

# H2 console only useful in local/dev. Disabled automatically when using PostgreSQL.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JWT — MUST be overridden in production via JWT_SECRET (min 32 chars / 256-bit).
# The default below is a development-only placeholder, never a production secret.
jwt.secret=${JWT_SECRET:veloxplay-dev-only-change-me-32chars-min!!}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.issuer=veloxplay

app.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080,http://127.0.0.1:8080}
app.seed.enabled=${APP_SEED_ENABLED:true}

# Demo accounts (only used by DataSeeder when the users table is empty)
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@veloxplay.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.demo-email=${SEED_DEMO_EMAIL:demo@veloxplay.com}
app.seed.demo-password=${SEED_DEMO_PASSWORD:Demo@123}
